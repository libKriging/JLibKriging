name: CI

# Build libKriging's C API from the pinned sources and run libKriging's own
# Julia test-suite against the generated JLibKriging module. A push to master
# that passes on all platforms then registers the package (see `register`).
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * SAT'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # a hang must fail fast, not burn the 6h default
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia: ['1']
        include:
          - os: ubuntu-latest
            julia: 'lts'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Build (deps/build.jl)
        uses: julia-actions/julia-buildpkg@v1
      - name: Test
        uses: julia-actions/julia-runtest@v1

  register:
    name: Register on the General registry
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already registered (or being registered)?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -eo pipefail
          NAME=$(awk -F'"' '/^name *=/ { print $2; exit }' Project.toml)
          VERSION=$(awk -F'"' '/^version *=/ { print $2; exit }' Project.toml)
          echo "Package ${NAME} v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # registry layout: <first letter>/<name>/Versions.toml
          URL="https://raw.githubusercontent.com/JuliaRegistries/General/master/${NAME:0:1}/${NAME}/Versions.toml"
          CODE=$(curl -s -o versions.toml -w '%{http_code}' "$URL")
          if [ "$CODE" = "200" ] && grep -q "^\[\"${VERSION}\"\]" versions.toml; then
            echo "already registered"; echo "register=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # avoid re-triggering Registrator while its pull request is still open. The
          # search is case-insensitive, so filter on the exact title (case-sensitive):
          # an old "jlibkriging" pull request must not block "JLibKriging".
          PENDING=$(gh pr list --repo JuliaRegistries/General --state open \
                      --search "\"${NAME} v${VERSION}\" in:title" --json title |
                    jq --arg n "${NAME}" --arg v "${VERSION}" \
                       '[.[] | select(.title == "New package: \($n) v\($v)" or .title == "New version: \($n) v\($v)")] | length')
          if [ "${PENDING}" != "0" ]; then
            echo "a registration pull request is already open"; echo "register=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "register=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Registrator via a commit comment
        if: steps.check.outputs.register == 'true'
        env:
          # a user token (not GITHUB_TOKEN): Registrator only reacts to
          # comments made by a user with write access
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        shell: bash
        run: |
          set -eo pipefail
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="@JuliaRegistrator register"
